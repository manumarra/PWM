<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doremi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/assets/doremi.png">
  </head>
  <body>

    <div class="navbar-wrapper" id="homeNavBar"></div>

   <main class="signup-hero" id="signupHero">
        <!-- Contenitore a griglia Bootstrap: la somma delle colonne col-md-6 fa 12 -->
        <div class="row g-0 switch-card" id="signupCard">
            
            <!-- Pannello Informativo (colonna da 6 su schermi medi/desktop) -->
            <div class="col-12 col-md-6 panel info-panel">
              <h1 id="formEmoji" class="fade-content">👨‍🍳🍳👩‍🍳</h1>    
              <h2 id="infoTitle" class="fade-content">Registrati come Ristoratore</h2>
              <p id="infoDesc" class="fade-content">Porta i tuoi piatti a migliaia di nuovi clienti nella tua città.</p>
            </div>

            <!-- Bottone di scambio centrale -->
            <button type="button" class="btn-switch" id="switchBtn" title="Inverti modalità">
            ⇄
            </button>

            <!-- Pannello Form (colonna da 6 su schermi medi/desktop) -->
            <div class="col-12 col-md-6 panel form-panel">
                <form id="signupForm" novalidate>

                  <div class="row g-2 mb-2">
                    <div class="col-12" id="nameCol">
                      <label class="form-label mb-1" id="nameLabel" for="name">Nome Attività</label>
                      <input type="text" name="name" class="form-control" id="name" placeholder="Mario" value="Mario" autocomplete="..." required>
                    </div>
                    <div class="col-6" id="surnameCol" style="display: none;">
                      <label class="form-label mb-1" for="surname">Cognome</label>
                      <input type="text" name="surname" id="surname" class="form-control" placeholder="Rossi">
                    </div>
                  </div>

                  <div class="row g-2 mb-2">
                    <div class="col-6">
                      <label class="form-label mb-1" for="email">Email</label>
                      <input type="email" name="email" id="email" class="form-control" placeholder="mario@email.it" value="manuel@gmail.com" autocomplete="..." required>
                    </div>
                    <div class="col-6">
                      <label class="form-label mb-1" for="password">Password</label>
                      <input type="password" name="password" id="password" class="form-control" value="123456" minlength="6" required>
                    </div>
                  </div>

                  <div class="row g-2 mb-2">
                    <div class="col-6" id="phoneCol">
                      <label class="form-label mb-1" for="phone">Telefono</label>
                      <input type="tel" name="phone" id="phone" class="form-control" value="1234567890" autocomplete="..." required>
                    </div>
                    <div class="col-6" id="ivaContainer">
                      <label class="form-label mb-1" for="iva">Partita IVA</label>
                      <input type="text" name="ivaNumber" id="iva" class="form-control" placeholder="11 cifre" value="12345678901" maxlength="11">
                    </div>
                  </div>

                  <div class="row g-2 mb-3">
                    <div class="col-12">
                      <label class="form-label mb-1" for="address">Indirizzo (Via e Civico)</label>
                      <input type="text" name="street" id="address" class="form-control" placeholder="Via Roma 12" value="Via Roma 12" minlength="2" autocomplete="..." required>
                    </div>
                    <div class="col-6">
                      <label class="form-label mb-1" for="city">Città</label>
                      <input type="text" name="city" id="city" class="form-control" placeholder="Milano" value="Milano" pattern="[a-zA-ZàèéìòùÀÈÉÌÒÙ\s\-']{2,50}" required>
                    </div>
                    <div class="col-3">
                      <label class="form-label mb-1" for="cap">CAP</label>
                      <input type="text" name="zip" id="cap" class="form-control" placeholder="92024" value="92024" maxlength="5" pattern="\d{5}" required>
                    </div>
                    <div class="col-3">
                      <label class="form-label mb-1" for="country">Stato</label>
                      <input type="text" name="country" id="country" class="form-control" value="ITA" maxlength="3" pattern="[a-zA-Z]{3}" autocomplete="..." required>
                    </div>
                  </div>

                  <button type="submit" class="btn-night w-100">Crea Account</button>
                </form>
            </div>

        </div>
    </main>

    <footer id="homeFooter" class="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/components/navbars.js"></script>
    <script src="/components/footer.js"></script>
    <script src="/utils/common/signup.js" type="module"></script>
    <script src="/components/alerts.js" type="module"></script>
    <script>getNavbar(0,"homeNavBar");</script>
    <script>getFooter();</script>

  </body>
</html>
