<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerca piatti</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="customer-home-page d-flex flex-column">

  <header id="navbar-container"></header>

  <div id="alert-container" class="position-fixed top-0 end-0 p-3 toast-feedback-container"></div>

  <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="userOffcanvas" aria-labelledby="userOffcanvasLabel"></div>
  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true"></div>
  <div class="modal fade" id="editCredentialModal" tabindex="-1" aria-labelledby="editCredentialModalLabel" aria-hidden="true"></div>
  <div class="modal fade" id="deleteModalToggle2" tabindex="-1" aria-labelledby="deleteModalToggle2Label" aria-hidden="true"></div>

  <main class="container my-4 flex-grow-1">

    <section class="customer-hero-banner mb-4">
      <h1 class="customer-hero-title mb-2">Cerca il tuo piatto</h1>
      <p class="customer-hero-subtitle mb-0">Filtra per nome, tipologia, prezzo, ingredienti e allergeni in tutti i ristoranti.</p>
    </section>

    <!-- Filtri -->
    <form id="dishSearchForm" class="row g-3 mb-2" autocomplete="off">
      <div class="col-12 col-md-4">
        <div class="input-group">
          <span class="input-group-text menu-input-icon"><i class="bi bi-search"></i></span>
          <input type="search" id="fSearch" class="form-control menu-search-input" placeholder="Nome del piatto..." aria-label="Nome del piatto">
        </div>
      </div>
      <div class="col-6 col-md-3">
        <input type="search" id="fCategory" class="form-control menu-search-input" list="categoryOptions" placeholder="Tipologia (es. Dessert)" aria-label="Tipologia">
        <datalist id="categoryOptions">
          <option value="Beef"></option>
          <option value="Breakfast"></option>
          <option value="Chicken"></option>
          <option value="Dessert"></option>
          <option value="Goat"></option>
          <option value="Lamb"></option>
          <option value="Miscellaneous"></option>
          <option value="Pasta"></option>
          <option value="Pork"></option>
          <option value="Seafood"></option>
          <option value="Side"></option>
          <option value="Starter"></option>
          <option value="Vegan"></option>
          <option value="Vegetarian"></option>
          <option value="Altro"></option>
        </datalist>
      </div>
      <div class="col-6 col-md-3">
        <input type="search" id="fCity" class="form-control menu-search-input" placeholder="Città" aria-label="Città">
      </div>
      <div class="col-12 col-md-2">
        <select id="fSort" class="form-select menu-filter-select" aria-label="Ordinamento">
          <option value="name">Nome A-Z</option>
          <option value="price_asc">Prezzo crescente</option>
          <option value="price_desc">Prezzo decrescente</option>
        </select>
      </div>

      <div class="col-6 col-md-2">
        <input type="number" id="fMinPrice" min="0" step="0.5" class="form-control menu-search-input" placeholder="Prezzo min €" aria-label="Prezzo minimo">
      </div>
      <div class="col-6 col-md-2">
        <input type="number" id="fMaxPrice" min="0" step="0.5" class="form-control menu-search-input" placeholder="Prezzo max €" aria-label="Prezzo massimo">
      </div>
      <div class="col-12 col-md-4">
        <input type="search" id="fIngredient" class="form-control menu-search-input" placeholder="Ingredienti (es. cheese, tomato)" aria-label="Ingredienti separati da virgola">
      </div>
      <div class="col-8 col-md-3">
        <div class="dropdown">
          <button class="btn menu-filter-select w-100 text-start d-flex justify-content-between align-items-center"
                  type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
            <span id="allergenFilterLabel">Senza allergeni</span>
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="dropdown-menu allergen-filter-list p-2" id="allergenFilterList"></div>
        </div>
      </div>
      <div class="col-4 col-md-1">
        <button type="button" id="resetFiltersBtn" class="btn btn-outline-warning w-100" title="Azzera i filtri">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
      </div>
    </form>

    <p class="small text-secondary mb-4">
      <i class="bi bi-info-circle me-1"></i>
      Gli allergeni sono dedotti dagli ingredienti e sono indicativi: verifica sempre con il ristorante.
    </p>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="small text-secondary" id="dishCountLabel">Caricamento...</span>
    </div>

    <!-- Risultati -->
    <div id="dishResultsGrid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4"></div>

    <div class="text-center py-5 d-none" id="dishEmptyMsg">
      <i class="bi bi-search fs-1 text-warning d-block mb-3"></i>
      <h4 class="fw-bold">Nessun piatto trovato</h4>
      <p class="text-secondary small mb-0">Prova a cambiare o ad azzerare i filtri.</p>
    </div>

    <div class="text-center mb-5">
      <button type="button" id="loadMoreBtn" class="btn btn-amber d-none">Carica altri piatti</button>
    </div>

  </main>

  <footer id="homeFooter" class="mt-auto site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/components/navbars.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/logout.js"></script>

  <script type="module">
    import { getCanvas, getCanvasContent } from "/components/canvasHome.js";
    import "/components/alerts.js";

    getNavbar(2, "navbar-container");
    getFooter();
    getCanvas();
    getCanvasContent();
    getFooterLogoutAndForm();

    // Evidenzia la voce "Piatti" nella navbar
    document.querySelectorAll("#navbar-container .nav-link").forEach((a) => {
      a.classList.toggle("active", a.getAttribute("href") === window.location.pathname);
    });

    import("/utils/common/deleteOrUpdateCredential.js");
  </script>
  <script src="/utils/common/userHome.js" type="module"></script>
  <script src="/utils/customer/dishSearch.js" type="module"></script>
</body>
</html>
