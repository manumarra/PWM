<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esito del pagamento - Food Delivery</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="customer-page d-flex flex-column min-vh-100">

  <header id="navbar-container"></header>
  <div id="alert-container" class="toast-feedback-container"></div>

  <!-- Offcanvas Utente & Modali Credenziali -->
  <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="userOffcanvas" aria-labelledby="userOffcanvasLabel"></div>
  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true"></div>
  <div class="modal fade" id="editCredentialModal" tabindex="-1" aria-labelledby="editCredentialModalLabel" aria-hidden="true"></div>
  <div class="modal fade" id="deleteModalToggle2" tabindex="-1" aria-labelledby="deleteModalToggle2Label" aria-hidden="true"></div>

  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="checkout-card text-center py-5 px-4">
          <div id="paymentIcon" class="display-3 mb-3"></div>
          <h2 id="paymentTitle" class="fw-bold mb-2">Verifica del pagamento...</h2>
          <p id="paymentMessage" class="text-secondary mb-4">Attendi qualche istante.</p>

          <div id="paymentSpinner" class="spinner-border text-warning mb-4" role="status"></div>

          <div id="paymentActions" class="d-flex flex-column flex-sm-row gap-2 justify-content-center d-none">
            <a href="/pages/customer/orderHistory.html" class="btn btn-warning rounded-pill fw-bold px-4">Vai ai miei ordini</a>
            <a href="/pages/customer/home.html" class="btn btn-outline-secondary rounded-pill px-4">Torna ai locali</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="homeFooter" class="mt-auto site-footer"></footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/components/navbars.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/logout.js"></script>

  <script type="module">
    import { getCanvas, getCanvasContent } from "/components/canvasHome.js";
    import "/components/alerts.js";

    getNavbar(2, "navbar-container");
    getFooter();
    getCanvas();
    getCanvasContent();
    getFooterLogoutAndForm();

    import("/utils/common/deleteOrUpdateCredential.js");
  </script>

  <!-- Controller della pagina -->
  <script src="/utils/customer/paymentResult.js" type="module"></script>
  <script src="/utils/common/userHome.js" type="module"></script>
</body>
</html>
