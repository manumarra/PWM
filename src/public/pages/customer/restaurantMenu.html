<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Scegli il tuo Ristorante</title>
  
  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Stile Condiviso Unificato -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="customer-home-page d-flex flex-column">

  <!-- Header con Navbar dinamica -->
  <header id="navbar-container"></header>

  <!-- Toast notifiche -->
  <div id="alert-container" class="position-fixed top-0 end-0 p-3 toast-feedback-container"></div>

  <!-- Offcanvas Utente & Modali Credenziali -->
  <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="userOffcanvas" aria-labelledby="userOffcanvasLabel"></div>
  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true"></div>
  <div class="modal fade" id="editCredentialModal" tabindex="-1" aria-labelledby="editCredentialModalLabel" aria-hidden="true"></div>
  <div class="modal fade" id="deleteModalToggle2" tabindex="-1" aria-labelledby="deleteModalToggle2Label" aria-hidden="true"></div>

<main class="container my-4 flex-grow-1">

    <!-- Hero Banner del Ristorante -->
    <section class="restaurant-hero-banner d-none" id="restaurantHero">
      <div class="restaurant-hero-bg" id="heroBgImage"></div>
      <div class="restaurant-hero-overlay"></div>
      <div class="restaurant-hero-content">
        <div class="restaurant-meta-badges">
          <span class="badge-status-open">Aperto</span>
          <span class="badge-category" id="restaurantCategoryLabel">Ristorante</span>
        </div>
        <h1 class="restaurant-hero-name" id="restaurantNameLabel">Nome Ristorante</h1>
        <div class="restaurant-details-row">
          <div class="restaurant-detail-item">
            <i class="bi bi-geo-alt-fill"></i>
            <span id="restaurantAddressLabel">Indirizzo non disponibile</span>
          </div>
          <div class="restaurant-detail-item">
            <i class="bi bi-telephone-fill"></i>
            <span id="restaurantPhoneLabel">Telefono non disponibile</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Skeleton/Spinner di caricamento per il banner -->
    <div class="text-center py-5" id="heroSpinner">
      <div class="spinner-border text-warning" role="status">
        <span class="visually-hidden">Caricamento locale...</span>
      </div>
    </div>

    <!-- Layout a 2 Colonne: Menù a Sinistra, Carrello a Destra -->
    <div class="row gx-lg-5">
      
      <!-- LATO SINISTRO: Prodotti e Filtri (8 colonne su PC) -->
      <div class="col-12 col-lg-8">
        
        <!-- Barra Ricerca & Filtri -->
        <div class="row g-3 mb-4 mt-1">
          <div class="col-12 col-md-5">
            <div class="input-group">
              <span class="input-group-text menu-input-icon"><i class="bi bi-search"></i></span>
              <input type="search" id="menuSearchInput" class="form-control menu-search-input" placeholder="Cerca piatto...">
            </div>
          </div>
          <div class="col-6 col-md-4">
            <select id="menuCategorySelect" class="form-select menu-filter-select">
              <option value="">Tutte le categorie</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <select id="menuStatusSelect" class="form-select menu-filter-select">
              <option value="all">Tutti</option>
              <option value="available">Disponibili</option>
              <option value="unavailable">Esauriti</option>
              <option value="discounted">In offerta</option>
            </select>
          </div>
        </div>

        <!-- Badge Contatori -->
        <div class="menu-summary-bar mb-4 px-1">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
            <div class="d-flex flex-wrap align-items-center gap-2 gap-sm-3 small">
              <span>In offerta: <strong id="countDiscounted" class="count-discounted">0</strong></span>
              <span class="d-none d-sm-inline">•</span>
              <span>Disponibili: <strong id="countAvailable" class="count-available">0</strong></span>
            </div>
            <div id="renderedCounter" class="small ms-auto ms-sm-0"></div>
          </div>
        </div>

        <!-- Griglia Prodotti -->
        <div id="menuCardsContainer" class="row row-cols-1 row-cols-md-2 g-4 mb-5"></div>
      </div>

      <!-- LATO DESTRO: Carrello (4 colonne su PC, scivola in basso su mobile) -->
      <div class="col-12 col-lg-4 mt-5 mt-lg-0">
        <!-- Container Sticky che scende con lo scroll -->
        <div class="customer-cart-container sticky-top">
          <div class="card border-0 shadow-lg rounded-4 p-2">
            <div class="card-body">
              <h4 class="fw-bold mb-4"><i class="bi bi-bag-check-fill text-warning me-2"></i> Il tuo Ordine</h4>
              
              <!-- Lista Piatti nel carrello -->
              <div id="cartItemsContainer" class="cart-items-container d-flex flex-column gap-3 mb-3 overflow-y-auto">
                <!-- Messaggio carrello vuoto di default -->
                <div class="text-center text-secondary small py-4" id="emptyCartMsg">
                  <i class="bi bi-cart-x fs-1 d-block mb-2 opacity-50"></i>
                  Il carrello è vuoto.<br>Aggiungi i piatti che desideri!
                </div>
              </div>
              <button type="button" class="btn btn-outline-danger btn-sm px-2 py-1 d-none" id="emptyCartBtn" title="Svuota carrello">
                <i class="bi bi-trash3"></i>
              </button>

              <!-- Checkout Footer -->
              <div class="border-top pt-3 mt-3">
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <span class="fw-semibold text-secondary">Totale</span>
                  <span class="fs-4 fw-bold">€ <span id="cartTotalPrice">0.00</span></span>
                </div>
                <button type="button" class="btn btn-amber w-100 fw-bold py-2 shadow-sm" id="checkoutBtn" disabled>
                  Vai al Pagamento
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>


  <!-- Footer -->
  <footer id="homeFooter" class="mt-auto site-footer"></footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Inizializzazione Componenti Comuni e Controller -->
  <script src="/components/navbars.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/logout.js"></script>

  <script type="module">
    import { getCanvas, getCanvasContent } from "/components/canvasHome.js";
    import "/components/alerts.js";

    getNavbar(2, "navbar-container");
    getFooter();
    getCanvas();
    getCanvasContent();
    getFooterLogoutAndForm();

    import("/utils/common/deleteOrUpdateCredential.js");
  </script>
  <script src="/utils/common/userHome.js" type="module"></script>
  <script src="/utils/customer/restaurantMenu.js" type="module"></script>

</body>
</html>
