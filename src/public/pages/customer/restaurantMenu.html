<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Scegli il tuo Ristorante</title>
  
  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Stile Condiviso Unificato -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="customer-home-page d-flex flex-column">

  <!-- Header con Navbar dinamica -->
  <header id="navbar-container"></header>

  <!-- Toast notifiche -->
  <div id="alert-container" class="position-fixed top-0 end-0 p-3 toast-feedback-container"></div>

  <!-- Offcanvas Utente & Modali Credenziali -->
  <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="userOffcanvas" aria-labelledby="userOffcanvasLabel"></div>
  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true"></div>
  <div class="modal fade" id="editCredentialModal" tabindex="-1" aria-labelledby="editCredentialModalLabel" aria-hidden="true"></div>
  <div class="modal fade" id="deleteModalToggle2" tabindex="-1" aria-labelledby="deleteModalToggle2Label" aria-hidden="true"></div>

    <!-- Hero Banner del Ristorante (Popolato via JS) -->
    <section class="restaurant-hero-banner d-none" id="restaurantHero">
      <!-- Sfondi con overlay -->
      <div class="restaurant-hero-bg" id="heroBgImage"></div>
      <div class="restaurant-hero-overlay"></div>

      <!-- Contenuto in primo piano -->
      <div class="restaurant-hero-content">
        <div class="restaurant-meta-badges">
          <span class="badge-status-open">Aperto</span>
          <span class="badge-category" id="restaurantCategoryLabel">Ristorante</span>
        </div>

        <h1 class="restaurant-hero-name" id="restaurantNameLabel">Nome Ristorante</h1>

        <!-- Dettagli e recapiti -->
        <div class="restaurant-details-row">
          <div class="restaurant-detail-item">
            <i class="bi bi-geo-alt-fill"></i>
            <span id="restaurantAddressLabel">Indirizzo non disponibile</span>
          </div>
          <div class="restaurant-detail-item">
            <i class="bi bi-telephone-fill"></i>
            <span id="restaurantPhoneLabel">Telefono non disponibile</span>
          </div>
          <div class="restaurant-detail-item">
            <i class="bi bi-clock-fill"></i>
            <span>Orario d'apertura</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Skeleton/Spinner di caricamento per il banner -->
    <div class="text-center py-5" id="heroSpinner">
      <div class="spinner-border text-warning" role="status">
        <span class="visually-hidden">Caricamento locale...</span>
      </div>
    </div>


  <!-- Footer -->
  <footer id="homeFooter" class="mt-auto site-footer"></footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Inizializzazione Componenti Comuni e Controller -->
  <script src="/components/navbars.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/logout.js"></script>

  <script type="module">
    import { getCanvas, getCanvasContent } from "/components/canvasHome.js";
    import "/components/alerts.js";

    getNavbar(2, "navbar-container");
    getFooter();
    getCanvas();
    getCanvasContent();
    getFooterLogoutAndForm();

    import("/utils/common/deleteOrUpdateCredential.js");
  </script>
  <script src="/utils/common/userHome.js" type="module"></script>
  <script src="/utils/customer/restaurantMenu.js" type="module"></script>

</body>
</html>
