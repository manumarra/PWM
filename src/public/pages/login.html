<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doremi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/assets/doremi.png">
  </head>
  <body >

    <div class="navbar-wrapper" id="homeNavBar"></div>

    <main class="hero-section">
        <div class="switch-card login-card shadow-lg">
            <div class="row g-0 align-items-stretch">
                
                <!-- Colonna Sinistra (Branding & Messaggio) -->
                <div class="col-12 col-md-5 card-left-panel">
                <div>
                    <h2 class="card-brand-title">Bentornato!</h2>
                    <p class="card-brand-text">
                    Accedi con le tue credenziali per ordinare i tuoi piatti preferiti o gestire il menù del tuo ristorante.
                    </p>
                </div>

                <div class="card-bottom-link">
                    <p class="mb-1">Non hai ancora un account?</p>
                    <a href="/pages/signup.html" class="link-amber">Registrati ora &rarr;</a>
                </div>
                </div>

                <!-- Colonna Destra (Form di Login) -->
                <div class="col-12 col-md-7 card-right-panel">
                <h3 class="form-heading">Accedi alla piattaforma</h3>
                
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                    <label for="emailInput" class="form-label mb-1">Email</label>
                    <input type="email" id="emailInput" name="email" class="form-control" placeholder="...@email.it" required autocomplete="email" value="asd@gmail.com">
                    </div>

                    <div class="mb-4">
                    <label for="passwordInput" class="form-label mb-1">Password</label>
                    <input type="password" id="passwordInput" name="password" class="form-control" placeholder="123456" required autocomplete="current-password" value="123456">
                    </div>

                    <button type="submit" class="btn-amber w-100">Accedi</button>
                </form>
                </div>

            </div>
        </div>
    </main>

    
    <footer id="homeFooter" class="site-footer"></footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/utils/login.js" type="module"></script>
    <script src="/components/navbars.js"></script>
    <script src="/components/footer.js"></script>
    <script src="/components/alerts.js"></script>
    <script>getNavbar(0);</script>
    <script>getFooter();</script>

  </body>
</html>
