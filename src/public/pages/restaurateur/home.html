<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>

    <body class="bg-dark text-white min-vh-100 d-flex flex-column">

  <!-- 1. Header con Navbar iniettata da navbars.js -->
    <header id="navbar-container"></header>

    <!-- 2. Contenuto principale della Dashboard -->
      <main class="container my-4 flex-grow-1">
        <h1 class="h3 fw-bold mb-4">Pannello di Controllo</h1>
        <p class="text-secondary">Benvenuto nella gestione del tuo locale.</p>
      </main>

    <!-- 3. OFFCANVAS PROFILO RISTORATORE (a comparsa da destra) -->
    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="restaurantUserOffcanvas" aria-labelledby="restaurantUserOffcanvasLabel">
      <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="offcanvas-title fw-bold" id="restaurantUserOffcanvasLabel">
          <i class="bi bi-shop me-2 text-warning"></i> Area Ristoratore
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Chiudi"></button>
      </div>
      
      <div class="offcanvas-body d-flex flex-column justify-content-between p-4">
        <div>
          <!-- Dati Utente / Locale -->
          <div class="profile-card d-flex align-items-center gap-3 mb-4 p-3 rounded" role="button" data-bs-toggle="modal" data-bs-target="#editProfileModal">
            <i class="bi bi-person-circle fs-1 text-warning"></i>
            <div>
              <h6 class="mb-0 fw-bold" id="restaurateurName"></h6>
              <small class="text-secondary" id="restaurantEmail"></small>
            </div>
          </div>

          <!-- Voci di navigazione pannello -->
          <ul class="nav nav-pills flex-column gap-2">
            <li class="nav-item">
              <a class="nav-link " href="#">
                <i class="bi bi-gear"></i> Impostazioni Locale
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">
                <i class="bi bi-clock-history"></i> Orari di Apertura
              </a>
            </li>
          </ul>
        </div>

        <!-- Logout in fondo -->
        <div class="pt-3 border-top border-secondary">
          <div class="card-bottom-link offCanvasCredential ">
            <p class="mb-1">Modifica o elimina il tuo &nbsp;</p>
            <a href="#" class="link-amber" role="button" data-bs-toggle="modal" data-bs-target="#editCredentialModalLabel">account &rarr;</a>
          </div>
          <button class="btn btn-outline-danger" id="btnLogout">
            <i class="bi bi-box-arrow-right"></i> Esci
          </button>
        </div>
      </div>
    </div>
      <!--modal credential-->
    <div class="modal fade" id="editCredentialModalLabel" tabindex="-1" aria-labelledby="editCredentialModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable text-white">
        <div class="modal-content profile-modal-content border border-secondary shadow-lg">
    
          <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold" id="editProfileModalLabel">Modifica Credenziali</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Chiudi"></button>
          </div>

          <div class="modal-body p-4">

            <form id="editCredentialForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="editNewPassword">Nuova Password</label>
                <input type="text" class="form-control" id="editNewPassword" name="nameRest" required>
              </div>

              <div class="mb-3">
                <label class="form-label" for="editConfirmPassword">Conferma Nuova Password</label>
                <input type="text" class="form-control" id="editConfirmPassword" name="nameRest" required>
              </div>

              <hr class="profile-divider">
              <div class="mb-3">
                <label class="form-label" for="editOldPassword">Vecchia password</label>
                <input type="password" class="form-control" id="editOldPassword" name="password" autocomplete="off" ... required>
              </div>
            </form>
            
          </div>
          <form id="deleteCredentialForm" novalidate></form>
          
          <div class="modal-footer border-secondary">
            <button type="submit" form="deleteProfileForm" class="btn btn-outline-danger btn-modal-footer credential-footer">Elimina Account</button>              
            <button type="submit" form="editProfileForm" class="btn btn-night btn-modal-footer credential-footer">Salva Modifiche</button>
          </div>

        </div>
      </div>
    </div>
    
  <!--modal data-->
  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable text-white">
      <div class="modal-content profile-modal-content border border-secondary shadow-lg">
        
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold" id="editProfileModalLabel">Modifica Dati Personali</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>

        <div class="modal-body p-4">
          <form id="editProfileForm" novalidate>

            <div class="mb-3">
              <label class="form-label" for="editName">Nome Attività</label>
              <input type="text" class="form-control" id="editName" name="nameRest" required>
            </div>

            <div class="mb-3">
              <label class="form-label" for="editIva">Partita IVA</label>
              <input type="text" class="form-control" id="editIva" name="iva" >
            </div>

            <div class="mb-3">
              <label class="form-label" for="editPhone">Telefono</label>
              <input type="tel" class="form-control" id="editPhone" name="phone" autocomplete="phone" ...>
            </div>

            <hr class="profile-divider">
            <div class="row g-2 mb-3">
              <div class="col-12">
                <label class="form-label" for="editStreet">Via / Piazza</label>
                <input type="text" class="form-control" id="editStreet" name="street" required>
              </div>
              <div class="col-6">
                <label class="form-label" for="editCity">Città</label>
                <input type="text" class="form-control" id="editCity" name="city" required>
              </div>
              <div class="col-3">
                <label class="form-label" for="editZip">CAP</label>
                <input type="text" class="form-control" id="editZip" name="zip" required>
              </div>
              <div class="col-3">
                <label class="form-label" for="editCountry">Stato</label>
                <input type="text" class="form-control" id="editCountry" name="country" autocomplete="country" ... maxlength="3" required>
              </div>
            </div>
            <div id="modalAlert" class="alert alert-danger d-none py-2" role="alert"></div>

            <hr class="profile-divider">
            <div class="mb-3">
              <label class="form-label" for="editName">Conferma password</label>
              <input type="password" class="form-control" id="password" name="password" autocomplete="off" ... required>
            </div>

          </form>
        </div>

        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-night btn-modal-footer" data-bs-dismiss="modal">Annulla</button>
          <button type="submit" form="editProfileForm" class="btn btn-night btn-modal-footer">Salva Modifiche</button>
        </div>

      </div>
    </div>
  </div>


    <footer id="homeFooter" class="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/components/navbars.js"></script>
    <script src="/components/footer.js"></script>
    <script src="/components/alerts.js" type="module"></script>
    <script>getNavbar(1, "navbar-container");</script>
    <script>getFooter();</script>
    <script src="/utils/restHome.js" type="module"></script>

  </body>
</html>
