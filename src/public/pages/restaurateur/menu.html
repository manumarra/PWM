<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Menù - Food Delivery</title>
  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Foglio di stile unificato -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-body menu-builder-page">

  <!-- Header iniettato dinamicamente -->
  <header id="navbar-container"></header>

  <!-- Banner Notifiche Toast -->
  <div id="alert-container" class="position-fixed top-0 end-0 p-3 toast-feedback-container"></div>

  <!-- Offcanvas Profilo & Modali Credenziali -->
  <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="userOffcanvas" aria-labelledby="userOffcanvasLabel"></div>
  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true"></div>
  <div class="modal fade" id="editCredentialModal" tabindex="-1" aria-labelledby="editCredentialModalLabel" aria-hidden="true"></div>
  <div class="modal fade" id="deleteModalToggle2" tabindex="-1" aria-labelledby="deleteModalToggle2Label" aria-hidden="true"></div>

  <!-- Contenitore centrale -->
  <main class="container menu-builder-main">
    
    <!-- Intestazione Pagina & Azioni Rapide -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 menu-builder-header">
      <div>
        <h1 class="menu-builder-title mb-1">
          <i class="bi bi-journal-bookmark-fill me-2 menu-title-icon"></i>Il Tuo Menù Attivo
        </h1>
        <p class="menu-builder-subtitle mb-0">Imposta la disponibilità dei piatti per i clienti e applica sconti promozionali.</p>
      </div>
      <div class="d-flex align-items-center flex-wrap gap-2 menu-header-actions">
        <a href="/pages/restaurateur/productBuilder.html" class="btn btn-amber">
          <i class="bi bi-plus-circle me-2"></i>Aggiungi dal Catalogo
        </a>
      </div>
    </div>

    <!-- Barra Ricerca & Filtri -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-5">
        <div class="input-group">
          <span class="input-group-text menu-input-icon">
            <i class="bi bi-search"></i>
          </span>
          <input type="search" id="menuSearchInput" class="form-control menu-search-input" placeholder="Cerca tra i tuoi piatti...">
        </div>
      </div>

      <div class="col-6 col-md-4">
        <select id="menuCategorySelect" class="form-select menu-filter-select">
          <option value="">Tutte le categorie</option>
        </select>
      </div>

      <div class="col-6 col-md-3">
        <select id="menuStatusSelect" class="form-select menu-filter-select">
          <option value="all">Tutti gli stati</option>
          <option value="available">In menù</option>
          <option value="unavailable">Fuori menù</option>
          <option value="discounted">In offerta</option>
        </select>
      </div>
    </div>


  <!-- Badge Contatori di Sintesi & Azioni Massive -->
  <div class="menu-summary-bar mb-3 px-1">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
      
      <!-- Contatori a sinistra -->
      <div class="d-flex flex-wrap align-items-center gap-2 gap-sm-3 small">
        <span>In offerta: <strong id="countDiscounted" class="count-discounted">0</strong></span>
        <span class="d-none d-sm-inline">•</span>
        <span>In menù: <strong id="countAvailable" class="count-available">0</strong></span>
        <span class="d-none d-sm-inline">•</span>
        <span>Fuori menù: <strong id="countUnavailable" class="count-unavailable">0</strong></span>
      </div>

      <!-- Pulsanti e totale piatti a destra -->
      <div class="d-flex flex-wrap align-items-center gap-2 menu-summary-actions">
        <button type="button" class="btn-summary-action action-reset-discount" id="btnResetAllDiscounts" title="Azzera lo sconto di tutti i piatti">
          <i class="bi bi-tag"></i> <span>Annulla tutti gli sconti</span>
        </button>
        <button type="button" class="btn-summary-action action-disable-all" id="btnDisableAllProducts" title="Disattiva tutti i piatti dal menù">
          <i class="bi bi-eye-slash"></i> <span>Rendi tutto non disponibile</span>
        </button>
        <div id="renderedCounter" class="small ms-auto ms-sm-0"></div>
      </div>

    </div>
  </div>

    <!-- Griglia dei Prodotti del Menù -->
    <div id="menuCardsContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>

    <!-- Feedback Vuoto / Nessun Risultato -->
    <div id="emptyMenuMessage" class="menu-empty-msg d-none">
      <i class="bi bi-inbox fs-1 d-block mb-2"></i>
      <h5>Nessun piatto trovato</h5>
      <p class="small mb-0">Non ci sono piatti che corrispondono ai filtri selezionati.</p>
    </div>

    <!-- Sentinella per l'Infinite Scroll -->
    <div id="scrollSentinel" class="text-center py-4">
      <div id="scrollSpinner" class="spinner-border text-warning d-none" role="status">
        <span class="visually-hidden">Caricamento altri piatti...</span>
      </div>
    </div>

  </main>

  <!-- Modale Personalizzazione Piatto (iniettata dinamicamente) -->
  <div class="modal fade" id="customizeMealModal" tabindex="-1" aria-labelledby="customizeMealModalLabel" aria-hidden="true"></div>

  <!-- Footer -->
  <footer id="homeFooter" class="mt-auto site-footer"></footer>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script Componenti Globali -->
  <script src="/components/navbars.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/logout.js"></script>

  <!-- Inizializzazione Canvas & Navbar -->
  <script type="module">
    import { getCanvas, getCanvasContent } from "/components/canvasHome.js";
    import "/components/alerts.js";

    getNavbar(1, "navbar-container");
    getFooter();
    getCanvas();
    getCanvasContent();
    getFooterLogoutAndForm();

    import("/utils/common/deleteOrUpdateCredential.js");
  </script>
  <script src="/utils/common/userHome.js" type="module"></script>

  <!-- Controller della pagina Menù -->
  <script type="module" src="/utils/restaurateur/menu.js"></script>
</body>
</html>
