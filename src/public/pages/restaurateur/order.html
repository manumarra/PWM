<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Ordini - Food Delivery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-dark text-white min-vh-100 d-flex flex-column">

  <header id="navbar-container"></header>
  <div id="alert-container" class="toast-feedback-container"></div>

<main class="container-fluid my-4 flex-grow-1">
    <div class="dashboard-header mb-4">
      <h1 class="h3 fw-bold">Gestione Ordini</h1>
      <p class="dashboard-subtitle">Gestisci lo stato degli ordini e verifica i codici di consegna.</p>
    </div>

    <!-- Griglia fluida: 4 colonne su schermi larghi, va a capo automaticamente sui piccoli -->
    <div class="row g-4" id="ordersBoard">
      
      <!-- Colonna: Da Accettare (ordinato) -->
      <div class="col-12 col-md-6 col-xl-3">
        <div class="d-flex align-items-center justify-content-between mb-3 border-bottom border-secondary pb-2">
          <h5 class="fw-bold mb-0 text-white"><i class="bi bi-inbox-fill text-info me-2"></i>Nuovi</h5>
          <span class="badge bg-secondary rounded-pill" id="count-ordinato">0</span>
        </div>
        <!-- I div contenitori sono liberi da altezze fisse -->
        <div id="col-ordinato" class="d-flex flex-column gap-3"></div>
      </div>

      <!-- Colonna: In Preparazione -->
      <div class="col-12 col-md-6 col-xl-3">
        <div class="d-flex align-items-center justify-content-between mb-3 border-bottom border-secondary pb-2">
          <h5 class="fw-bold mb-0 text-white"><i class="bi bi-fire text-warning me-2"></i>In Preparazione</h5>
          <span class="badge bg-secondary rounded-pill" id="count-preparazione">0</span>
        </div>
        <div id="col-preparazione" class="d-flex flex-column gap-3"></div>
      </div>

      <!-- Colonna: In Consegna -->
      <div class="col-12 col-md-6 col-xl-3">
        <div class="d-flex align-items-center justify-content-between mb-3 border-bottom border-secondary pb-2">
          <h5 class="fw-bold mb-0 text-white"><i class="bi bi-bicycle text-primary me-2"></i>In Consegna</h5>
          <span class="badge bg-secondary rounded-pill" id="count-consegna">0</span>
        </div>
        <div id="col-consegna" class="d-flex flex-column gap-3"></div>
      </div>

      <!-- Colonna: Completati -->
      <div class="col-12 col-md-6 col-xl-3">
        <div class="d-flex align-items-center justify-content-between mb-3 border-bottom border-secondary pb-2">
          <h5 class="fw-bold mb-0 text-white"><i class="bi bi-check-circle-fill text-success me-2"></i>Completati</h5>
          <span class="badge bg-secondary rounded-pill" id="count-consegnato">0</span>
        </div>
        <div id="col-consegnato" class="d-flex flex-column gap-3"></div>
      </div>

    </div>
  </main>

  <!-- Modali e Offcanvas -->
  <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="userOffcanvas"></div>
  <div class="modal fade" id="editProfileModal" tabindex="-1"></div>
  <div class="modal fade" id="editCredentialModal" tabindex="-1"></div>
  <div class="modal fade" id="deleteModalToggle2" tabindex="-1"></div>    

  <footer id="homeFooter" class="site-footer mt-auto"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/components/navbars.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/logout.js"></script>
  
  <script type="module">
    import { getCanvas, getCanvasContent } from "/components/canvasHome.js";
    import "/components/alerts.js";

    getNavbar(1, "navbar-container");
    getFooter();
    getCanvas();
    getCanvasContent();
    getFooterLogoutAndForm();

    import("/utils/common/deleteOrUpdateCredential.js");
  </script>
  <script src="/utils/common/userHome.js" type="module"></script>
  <script src="/utils/restaurateur/order.js" type="module"></script>
</body>
</html>
