<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crea Menù - Food Delivery</title>
  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Foglio di stile esterno unificato -->
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="page-body menu-builder-page">

    <!-- Header iniettato dinamicamente -->
    <header id="navbar-container"></header>

    <!--CANVAS-->
    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="userOffcanvas" aria-labelledby="userOffcanvasLabel"></div>
    <!--MODAL DATA-->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true"></div>

    <!--modal credential-->
    <div class="modal fade" id="editCredentialModal" tabindex="-1" aria-labelledby="editCredentialModalLabel" aria-hidden="true"></div>
    <!--modal delete-->
    <div class="modal fade" id="deleteModalToggle2" tabindex="-1" aria-labelledby="deleteModalToggle2Label" aria-hidden="true"></div>    
  

    <!-- Contenitore centrale -->
    <main class="container menu-builder-main">

        <!-- Barra Superiore: Titoli e Pulsanti Apertura Offcanvas -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 menu-builder-header">
            <div>
                <h1 class="menu-builder-title mb-1">Componi il Menù</h1>
                <p class="menu-builder-subtitle mb-0">Scegli i piatti dal catalogo comune o personalizzali per il tuo locale.</p>
            </div>

            <div class="d-flex align-items-center flex-wrap gap-2 menu-header-actions">
                    
                <button class="btn-night" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCurrentMenu">
                    <i class="bi bi-journal-text me-2"></i>Il Mio Menù
                </button>
                
                <button class="btn btn-amber" type="button" id="btnCreateNewMeal">
                    <i class="bi bi-plus-circle me-2"></i>Crea Nuovo Piatto
                </button>

                <button class="btn-amber" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRecentAdded">
                    <i class="bi bi-cart-check me-2"></i>Aggiunti
                    <span class="badge bg-light text-dark ms-2" id="addedCountBadge">0</span>
                </button>
            </div>
        </div>

        <!-- Filtri di ricerca -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-8">
                <div class="input-group">
                    <span class="input-group-text menu-input-icon">
                     <i class="bi bi-search"></i>
                    </span>
                    <input 
                        type="search" id="searchInput" class="form-control menu-search-input" placeholder="Cerca piatto per nome...">
                </div>
            </div>
            <div class="col-12 col-md-4">
                <select id="categorySelect" class="form-select menu-filter-select">
                    <option value="">Tutte le categorie</option>
                    <option value="Beef">Beef</option>
                    <option value="Chicken">Chicken</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Pasta">pasta</option>
                    <option value="Seafood">Seafood</option>
                    <option value="Vegetarian">Vegetarian</option>
                    <hr>
                    <option value="custom">Personalizza...</option>
                </select>
                <div class="mt-2 d-none" id="customCategoryContainer">
                    <input type="text" id="customCategoryInput" class="form-control menu-search-input" placeholder="Scrivi la tua categoria...">
                </div>
            </div>
        </div>

        <!-- Griglia centrale: card iniettate da productBuilder.js -->
        <div class="row g-4" id="mealsGrid"></div>

        <!-- Feedback lista vuota -->
        <div class="menu-empty-msg d-none" id="emptyState">
            <i class="bi bi-inbox fs-1"></i>
            <p class="mt-2">Nessun piatto trovato con i criteri selezionati.</p>
        </div>

        <!-- Paginazione Server-Side -->
        <nav aria-label="Paginazione catalogo" class="mt-5">
            <ul class="pagination justify-content-center" id="paginationContainer"></ul>
        </nav>
    </main>

    <!-- OFFCANVAS SINISTRO: I Tuoi Prodotti (iniettato dinamicamente) -->
    <div class="offcanvas offcanvas-start menu-offcanvas" tabindex="-1" id="offcanvasCurrentMenu"></div>

    <!-- OFFCANVAS DESTRO: Aggiunti di Recente (iniettato dinamicamente) -->
    <div class="offcanvas offcanvas-end menu-offcanvas" tabindex="-1" id="offcanvasRecentAdded"></div>

    <!-- Modale Personalizzazione Piatto -->
    <div class="modal fade" id="customizeMealModal" tabindex="-1" aria-labelledby="customizeMealModalLabel" aria-hidden="true"></div>
    
    <!-- Modale Conferma Eliminazione Menù -->
    <div class="modal fade" id="deleteAllMenuConfirmModal" tabindex="-1" aria-labelledby="deleteAllMenuConfirmModalLabel" aria-hidden="true"></div>

    <hr class="profile-divider">
    <!-- Footer -->
    <footer id="homeFooter" class="mt-auto"></footer>

    <!-- Script JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/utils/productBuilder.js"></script>
    <!-- Script componenti non a modulo -->
    <script src="/components/navbars.js"></script>
    <script src="/components/footer.js"></script>
    <script src="/components/logout.js"></script>
    <!-- Script di montaggio e inizializzazione (type="module") -->
    <script type="module">
      import { getCanvas, getCanvasContent } from "/components/canvasHome.js";
      import "/components/alerts.js";

      // 1. Inietta navbar e footer
      getNavbar(1, "navbar-container");
      getFooter();

      // 2. Inietta il canvas (che contiene #footerLogout) e la modale dati
      getCanvas();

      getCanvasContent();
      // 3. Inietta il footer di logout e i form di modifica/eliminazione credenziali
      getFooterLogoutAndForm();

      // 4. Ora che i form esistono fisicamente nel DOM, carica gli ascoltatori degli eventi
      import("/utils/deleteOrUpdateCredential.js");
    </script>
    <script src="/utils/userHome.js" type="module"></script>
</body>
</html>
